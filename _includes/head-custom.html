<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ 
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      primaryColor: '#234',
      primaryTextColor: '#fff',
      primaryBorderColor: '#7a8a9a',
      lineColor: '#aab',
      secondaryColor: '#1a2a3a',
      tertiaryColor: '#2a3a4a',
      actorBkg: '#2a3a5a',
      actorBorder: '#6a8aba',
      actorTextColor: '#eef',
      actorLineColor: '#7a8a9a',
      signalColor: '#cce',
      signalTextColor: '#fff',
      labelBoxBkgColor: '#2a3a5a',
      labelBoxBorderColor: '#6a8aba',
      labelTextColor: '#eef',
      loopTextColor: '#dde',
      noteBorderColor: '#8a9aaa',
      noteBkgColor: '#3a4a5a',
      noteTextColor: '#fff'
    }
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var codes = document.querySelectorAll('code.language-mermaid');
    codes.forEach(function(el) {
      var pre = el.parentElement;
      if (pre && pre.tagName === 'PRE') {
        var codeContent = el.textContent;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeContent;
        pre.replaceWith(div);
      }
    });
    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
  });
</script>
