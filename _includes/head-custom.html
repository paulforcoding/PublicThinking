<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ 
    startOnLoad: false,
    theme: 'dark'
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var codes = document.querySelectorAll('code.language-mermaid');
    codes.forEach(function(el) {
      var pre = el.parentElement;
      if (pre && pre.tagName === 'PRE') {
        var codeContent = el.textContent;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeContent;
        pre.replaceWith(div);
      }
    });
    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
  });
</script>
<style>
  .mermaid svg text,
  .mermaid svg .label,
  .mermaid svg .actor text,
  .mermaid svg .messageText {
    fill: #e8e8e8 !important;
  }
  .mermaid svg .loopText,
  .mermaid svg .loopText > text {
    fill: #d0d0d0 !important;
  }
  .mermaid svg .noteText > text {
    fill: #fff !important;
  }
</style>
