<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ 
    startOnLoad: false,
    theme: 'default',
    themeVariables: {
      primaryColor: '#e1f5fe',
      primaryTextColor: '#1a1a2e',
      primaryBorderColor: '#0277bd',
      lineColor: '#01579b',
      secondaryColor: '#f3e5f5',
      tertiaryColor: '#e8eaf6',
      actorBkg: '#e3f2fd',
      actorBorder: '#1565c0',
      actorTextColor: '#0d1b2a',
      actorLineColor: '#1565c0',
      signalColor: '#1a237e',
      signalTextColor: '#0d1b2a',
      labelBoxBkgColor: '#e3f2fd',
      labelBoxBorderColor: '#1565c0',
      labelTextColor: '#0d1b2a',
      loopTextColor: '#1a237e',
      noteBorderColor: '#90a4ae',
      noteBkgColor: '#fff9c4',
      noteTextColor: '#1a1a2e'
    }
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var codes = document.querySelectorAll('code.language-mermaid');
    codes.forEach(function(el) {
      var pre = el.parentElement;
      if (pre && pre.tagName === 'PRE') {
        var codeContent = el.textContent;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeContent;
        pre.replaceWith(div);
      }
    });
    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
  });
</script>
<style>
  .mermaid svg text,
  .mermaid svg .label,
  .mermaid svg .actor text,
  .mermaid svg .messageText,
  .mermaid svg .loopText,
  .mermaid svg .loopText > text,
  .mermaid svg .noteText > text {
    fill: #1a1a2e !important;
    font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif !important;
  }
</style>
