<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ 
    startOnLoad: true,
    theme: 'base',
    themeVariables: {
      primaryColor: '#234',
      primaryTextColor: '#fff',
      primaryBorderColor: '#7a8a9a',
      lineColor: '#aab',
      secondaryColor: '#1a2a3a',
      tertiaryColor: '#2a3a4a',
      actorBkg: '#2a3a5a',
      actorBorder: '#6a8aba',
      actorTextColor: '#eef',
      actorLineColor: '#7a8a9a',
      signalColor: '#cce',
      signalTextColor: '#fff',
      labelBoxBkgColor: '#2a3a5a',
      labelBoxBorderColor: '#6a8aba',
      labelTextColor: '#eef',
      loopTextColor: '#dde',
      noteBorderColor: '#8a9aaa',
      noteBkgColor: '#3a4a5a',
      noteTextColor: '#fff'
    }
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const mermaidDivs = document.querySelectorAll('code.language-mermaid');
    mermaidDivs.forEach(function(el) {
      if (el.parentElement && el.parentElement.tagName === 'PRE') {
        el.parentElement.classList.add('mermaid');
        const codeContent = el.textContent;
        el.parentElement.innerHTML = '<div class="mermaid">' + codeContent + '</div>';
      }
    });
    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
  });
</script>
